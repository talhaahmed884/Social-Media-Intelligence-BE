spring:
  application:
    name: Social-Media-Intelligence

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/social_media_intelligence}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: false

logging:
  level:
    com.media.intelligence: INFO
    com.media.intelligence.common.validation: DEBUG  # Validation framework logging
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: logs/application.log
  logback:
    rolling-policy:
      max-file-size: 10MB
      max-history: 30

# ============================================
# Social connectors (platform API access)
# ============================================
social-connector:
  http:
    connect-timeout: 10s
    read-timeout: 30s
  retry:
    max-attempts: 3
    initial-delay: 1s
    backoff-multiplier: 2.0
    max-delay: 30s
  # Optional per-account overrides of the local rate-limit guard, e.g.:
  # rate-limits:
  #   instagram: { max-requests: 200, window: 1h }
  instagram:
    api-version: v26.0
    # From the Meta App Dashboard (Instagram > API setup with Instagram login); only needed for OAuth
    client-id: ${INSTAGRAM_CLIENT_ID:}
    client-secret: ${INSTAGRAM_CLIENT_SECRET:}
    # Must exactly match a redirect URI registered in the dashboard
    redirect-uri: ${INSTAGRAM_REDIRECT_URI:http://localhost:8080/api/v1/social-accounts/oauth/instagram/callback}

# ============================================
# Linked social accounts
# ============================================
social-account:
  # Base64 AES key for encrypting stored tokens (openssl rand -base64 32). Required to link accounts.
  token-encryption-key: ${SOCIAL_TOKEN_ENCRYPTION_KEY:}
  oauth:
    # HMAC secret for OAuth state; set it when running more than one instance
    state-secret: ${SOCIAL_OAUTH_STATE_SECRET:}
    state-ttl: 10m
  token-refresh:
    enabled: true
    cron: "0 0 3 * * *"
    refresh-before: 10d
    min-token-age: 24h
